# giode.toml configures how the giode CLI builds this app.
# Reference: https://github.com/mehran9675/giode-cli#giodetoml

[app]
name = "GoEncode"
id = "com.goencode.app"            # reverse-DNS, unique to your app; stores never let it change
version = "0.1.0"
build = 1                    # raise for every store upload (giode bump)
icon = "assets/icon.png"
package = "."
platforms = ["windows", "macos", "linux", "android"]   # iOS is left out: it doesn't let apps run ffmpeg
publisher = "GoEncode"
description = "Remux, encode and transcode media files with ffmpeg"
website = "https://github.com/xmhrnx/goencode"

[android]
min_sdk = 24
keep_alive = true            # keeps a batch encoding while the app is in the background
# ffmpeg and ffprobe for each ABI, built by android/build-ffmpeg.sh (run it
# before giode build android); see docs/ffmpeg.md.
libraries = ["android/ffmpeg.aar"]
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[ios]
min_os = 15
# profile = "App.mobileprovision" # for device builds; giode run ios-sim needs none
# team_id = "TEAMID"

# Texts iOS shows when asking for permission. iOS ends an app that uses
# the camera, microphone or speech recognition without them.
# [ios.usage]
# camera = "To attach photos you take."
# microphone = "To dictate notes."

[macos]
min_os = 11
# identity = "Developer ID Application: Your Name (TEAMID)"  # signs giode build -release
# notary_id = "you@example.com"     # notarizes, with the password in $GIODE_NOTARY_PASS
# notary_team_id = "TEAMID"

[windows]
arch = "amd64"
# cc = "x86_64-w64-mingw32-gcc"  # only for cgo apps linking C libraries

[windows.installer]
# per_machine = true         # install for all users into Program Files (asks for admin)
# desktop_shortcut = true
# license = "assets/license.txt"

[windows.msix]
# The signing certificate's subject; a certificate that signs the MSIX
# must have this exact subject (or use the Partner Center publisher ID).
publisher = "CN=xmhrnx"

[windows.signing]
# certificate = "codesign.pfx"   # created by giode cert (testing) or bought; password in $GIODE_WINDOWS_CERT_PASS
# timestamp = "http://timestamp.digicert.com"

[linux]
categories = ["AudioVideo", "Video", "Audio"]   # freedesktop menu categories
license = "Apache-2.0"       # SPDX, for .deb, .rpm and AppStream

# CI: .github/workflows/release.yml is generated from this section with
# `giode ci -f`. Publishing a GitHub release builds the installers for every
# platform above and attaches them to it.
[ci]
trigger = "release"
test = "go vet ./... && go test -short ./..."

# Installs what the Android packages need (nasm, bundletool) and builds ffmpeg
# for Android before they're packaged; the script skips the test job.
[ci.setup]
linux = "bash android/ci-setup.sh"
